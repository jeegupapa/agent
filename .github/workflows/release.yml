# 태그(v*)를 푸시하면 Windows 설치 파일을 빌드해 GitHub Releases 에 올린다.
# 설치된 앱(electron-updater, provider: github)이 이 Release 를 보고 자동 업데이트한다.
#
# 배포 순서:
#   1. package.json 의 version 을 올린다 (예: npm version 0.3.0 --no-git-tag-version)
#   2. git commit -am "v0.3.0" && git tag v0.3.0 && git push && git push --tags
#
# electron-builder 의 GitHub 퍼블리셔는 파일을 병렬로 올리다 draft 를 두 개 만드는 경우가 있어
# 빌드만 하고(--publish never) 업로드는 action-gh-release 로 한 번에 한다.
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          PKG=$(node -p "require('./package.json').version")
          TAG=${GITHUB_REF#refs/tags/v}
          if [ "$PKG" != "$TAG" ]; then
            echo "package.json version ($PKG) != tag ($TAG)"; exit 1
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Build installer
        run: npx electron-vite build && npx electron-builder --win --publish never

      - name: List build output
        shell: bash
        run: ls -la release

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml

      - name: Upload build artifacts (for workflow_dispatch runs)
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: actions/upload-artifact@v4
        with:
          name: installer
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
